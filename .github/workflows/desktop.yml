name: Build Clario Windows beta
on:
  push:
    branches: [codex/clario-windows-launcher]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run prepare-assets
      - run: node scripts/integration-smoke.cjs
      - run: npm run dist:win
      - name: Launch packaged application smoke check
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'release/win-unpacked/Clario Studio.exe' -ArgumentList '--clario-smoke-test' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged application startup timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged application startup failed' }
          $diagnostics = Join-Path $env:APPDATA 'Clario Studio/smoke-test.json'
          $result = Get-Content $diagnostics | ConvertFrom-Json
          if (-not $result.core -or -not $result.advanced -or -not $result.bridge -or -not $result.ocr -or -not $result.converter) { throw 'Packaged modules are unavailable' }
      - uses: actions/upload-artifact@v4
        with:
          name: Clario-Windows-Beta
          path: |
            release/Clario-Studio-*-Setup.exe
            release/Clario-Studio-*-Setup.exe.blockmap
          if-no-files-found: error
          retention-days: 14
